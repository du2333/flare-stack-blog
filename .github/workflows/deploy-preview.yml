name: deploy preview to cloudflare workers

# Preview 环境：用于每期改动的可视化验收，不影响生产。
#
# 触发方式：
#   1. 手动（workflow_dispatch）—— 推荐，可控
#   2. 非 main 分支 push 到 theme/yozora-ext 系列分支 —— 自动
#
# 部署目标：<worker-name>-preview.<subdomain>.workers.dev
# 使用独立的 D1 / KV / R2（由 secrets 中的 PREVIEW_* 变量提供）
#
# 与生产 deploy.yml 的区别：
#   - 不执行 D1 迁移（preview 库需手动初始化一次）
#   - 不 purge CDN 缓存
#   - 使用 wrangler --env preview

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "要部署的分支"
        required: false
        default: "main"
  push:
    branches:
      - "theme/**"
      - "feat/**"
    paths-ignore:
      - "**.md"
      - "anime-redesign/**"
      - "review/**"
      - "plan/**"

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    env:
      PREVIEW_WORKER_NAME: flare-stack-blog
      THEME: yozora
      # Cloudflare 账号的 workers.dev 子域（每个账号唯一，不是省略的）
      # 实际 URL 形如 <worker>.<subdomain>.workers.dev
      WORKERS_DEV_SUBDOMAIN: 3286927775
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Import secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_D1_DATABASE_ID: ${{ secrets.PREVIEW_D1_DATABASE_ID }}
          PREVIEW_KV_NAMESPACE_ID: ${{ secrets.PREVIEW_KV_NAMESPACE_ID }}
          PREVIEW_BUCKET_NAME: ${{ secrets.PREVIEW_BUCKET_NAME }}
        run: |
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> $GITHUB_ENV
          echo "D1_DATABASE_ID=$PREVIEW_D1_DATABASE_ID" >> $GITHUB_ENV
          echo "KV_NAMESPACE_ID=$PREVIEW_KV_NAMESPACE_ID" >> $GITHUB_ENV
          echo "BUCKET_NAME=$PREVIEW_BUCKET_NAME" >> $GITHUB_ENV

      - name: Import runtime secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PAGEVIEW_SALT: ${{ secrets.PAGEVIEW_SALT }}
        run: |
          echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET" >> $GITHUB_ENV
          echo "ADMIN_EMAIL=$ADMIN_EMAIL" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET" >> $GITHUB_ENV
          echo "CLOUDFLARE_ZONE_ID=$CLOUDFLARE_ZONE_ID" >> $GITHUB_ENV
          echo "PAGEVIEW_SALT=$PAGEVIEW_SALT" >> $GITHUB_ENV
          # preview 走 workers.dev，完整域名含账号子域：
          #   <worker>.<subdomain>.workers.dev
          PREVIEW_HOST="${PREVIEW_WORKER_NAME}-preview.${WORKERS_DEV_SUBDOMAIN}.workers.dev"
          echo "PREVIEW_HOST=${PREVIEW_HOST}" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=https://${PREVIEW_HOST}" >> $GITHUB_ENV
          echo "DOMAIN=${PREVIEW_HOST}" >> $GITHUB_ENV
          # preview 不需要 CDN purge
          echo "CLOUDFLARE_PURGE_API_TOKEN=" >> $GITHUB_ENV

      - name: Inject Resource IDs
        env:
          ROUTE: ""
          ZONE_NAME: ""
        run: |
          export ROUTE
          export ZONE_NAME
          bun run wrangler:prepare

      - name: Strip preview-incompatible bindings
        run: |
          # preview 环境需要剥离两类独占资源配置：
          #
          # 1. routes —— preview 不绑定自定义域名，走 workers.dev
          # 2. queues.consumers —— Cloudflare 规定一个队列只能有一个消费者，
          #    生产环境已占用 blog-queue；preview 重复声明会报
          #    "Queue 'blog-queue' already has a consumer [code: 11004]"
          #
          # 保留：producers（可多个）、durable_objects / workflows / migrations
          #      （按 Worker 隔离，不冲突）
          #
          # 3. Worker 名称 —— wrangler.jsonc 由 wrangler.example.jsonc 生成，
          #    name 仍是生产名（my-blog）。不改名的话，任何未显式带 --name
          #    的命令（如 secret bulk）都会打到生产 Worker，预览 Worker 拿不到
          #    密钥，运行时 serverEnv() 校验失败 → 全站 500。
          #
          # 注意：剥离后必须清理尾逗号，否则 JSON 非法
          node -e "
            const fs = require('fs');
            let cfg = fs.readFileSync('wrangler.jsonc', 'utf8');
            const orig = cfg.length;

            // 1. 剥离 routes 数组
            cfg = cfg.replace(/\"routes\"\s*:\s*\[[\s\S]*?\]\s*,?/g, '');

            // 2. 剥离 queues.consumers 数组
            cfg = cfg.replace(/\"consumers\"\s*:\s*\[[\s\S]*?\]\s*,?/g, '');

            // 3. 清理剥离后残留的尾逗号与空行
            cfg = cfg.replace(/,\s*([}\]])/g, '\$1');
            cfg = cfg.replace(/\n\s*\n/g, '\n');

            // 4. 重命名 Worker，使其与 --name 的部署目标一致
            const previewWorker = process.env.PREVIEW_WORKER_NAME + '-preview';
            if (!/\"name\"\s*:\s*\"[^\"]*\"/.test(cfg)) {
              console.error('FATAL: wrangler.jsonc 中找不到 name 字段，无法重命名为预览 Worker');
              process.exit(1);
            }
            cfg = cfg.replace(/\"name\"\s*:\s*\"[^\"]*\"/, '\"name\": \"' + previewWorker + '\"');

            // 5. 校验：去注释后必须能 parse
            const clean = cfg.replace(/^\s*\/\/.*\$/gm, '');
            try {
              JSON.parse(clean);
            } catch (e) {
              console.error('FATAL: wrangler.jsonc 在剥离后不是合法 JSON: ' + e.message);
              process.exit(1);
            }

            fs.writeFileSync('wrangler.jsonc', cfg);
            console.log('stripped: ' + (orig - cfg.length) + ' chars, JSON valid');
            console.log('  routes present: ' + /\"routes\"\s*:/.test(cfg));
            console.log('  consumers present: ' + /\"consumers\"\s*:/.test(cfg));
            console.log('  producers kept: ' + /\"producers\"\s*:/.test(cfg));
            console.log('  worker name -> ' + previewWorker);
          "

      # 预览库是新建的空库，必须初始化表结构，否则 Worker 一查库就 500。
      # 这里用 wrangler 原生 apply（幂等），不用项目的 safe-d1-migrate
      # ——后者的校验逻辑是给生产用的，会比对 posts/comments 行数，空库必然失败。
      - name: Apply migrations to preview D1
        run: |
          echo "Applying migrations to preview database..."
          bunx wrangler d1 migrations apply DB --remote
          echo "--- 验证表结构 ---"
          bunx wrangler d1 execute DB --remote --json \
            --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table';" \
            | tee /tmp/table-count.json
          TABLES=$(node -e "const d=require('/tmp/table-count.json'); console.log(d[0].results[0].n)")
          echo "preview D1 表数量: $TABLES"
          if [ "$TABLES" -lt 5 ]; then
            echo "FATAL: 迁移后表数量异常（$TABLES），预期 >= 5"
            exit 1
          fi
          echo "migrations applied successfully"

      # 迁移只建表结构，不建初始数据。而 siteConfig 来自 system_config 表，
      # 该表为空会让 getDocumentStyle(siteConfig) 读到 undefined 并抛
      # "Cannot read properties of undefined (reading 'theme')" → 整站 500。
      #
      # 这里做两件事：
      #   1. 检测 system_config 是否为空
      #   2. 为空时用 PREVIEW_SEED_CONFIG（可选 secret）或最小默认值兜底
      #
      # 若已有数据则完全跳过，不覆盖任何已调整的预览配置。
      - name: Ensure system_config exists
        env:
          SEED_CONFIG: ${{ secrets.PREVIEW_SEED_CONFIG }}
        run: |
          bunx wrangler d1 execute DB --remote --json \
            --command "SELECT COUNT(*) AS n FROM system_config;" \
            | tee /tmp/cfg-count.json
          COUNT=$(node -e "const d=require('/tmp/cfg-count.json'); console.log(d[0].results[0].n)")
          echo "system_config 行数: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "已存在配置，跳过"
            exit 0
          fi

          echo "system_config 为空，写入初始配置..."

          if [ -n "$SEED_CONFIG" ]; then
            echo "使用 PREVIEW_SEED_CONFIG secret"
            CFG="$SEED_CONFIG"
          else
            echo "未提供 PREVIEW_SEED_CONFIG，使用最小默认值"
            CFG='{"email":{"host":"","port":465,"username":"","password":"","senderName":"","senderAddress":""},"notification":{"admin":{"channels":{"email":false,"webhook":false}},"user":{"emailEnabled":false},"webhooks":[]},"site":{"title":"Preview","author":"Preview","description":"Preview environment","social":[],"icons":{"faviconSvg":"","faviconIco":"","favicon96":"","appleTouchIcon":"","webApp192":"","webApp512":""},"theme":{"default":{"navBarName":"Preview"},"fuwari":{"homeBg":"","avatar":"","primaryHue":250}}}}'
          fi

          # 写入（单引号转义）
          ESCAPED=$(node -e "console.log(JSON.stringify(process.argv[1]).slice(1,-1))" "$CFG")
          bunx wrangler d1 execute DB --remote \
            --command "INSERT OR REPLACE INTO system_config (id, config_json, updated_at) VALUES (1, '$ESCAPED', unixepoch());"

          echo "--- 验证 ---"
          bunx wrangler d1 execute DB --remote --json \
            --command "SELECT COUNT(*) AS n FROM system_config;" \
            | tee /tmp/cfg-check.json
          FINAL=$(node -e "const d=require('/tmp/cfg-check.json'); console.log(d[0].results[0].n)")
          if [ "$FINAL" -lt 1 ]; then
            echo "FATAL: 初始配置写入失败"
            exit 1
          fi
          echo "system_config 初始化完成（$FINAL 行）"

      - name: Generate Secrets JSON
        run: |
          cat <<EOF > secrets.json
          {
            "BETTER_AUTH_SECRET": "$BETTER_AUTH_SECRET",
            "BETTER_AUTH_URL": "$BETTER_AUTH_URL",
            "ADMIN_EMAIL": "$ADMIN_EMAIL",
            "GITHUB_CLIENT_ID": "$GITHUB_CLIENT_ID",
            "GITHUB_CLIENT_SECRET": "$GITHUB_CLIENT_SECRET",
            "CLOUDFLARE_ZONE_ID": "$CLOUDFLARE_ZONE_ID",
            "CLOUDFLARE_PURGE_API_TOKEN": "",
            "DOMAIN": "$DOMAIN",
            "CDN_DOMAIN": "",
            "VITE_UMAMI_WEBSITE_ID": "",
            "UMAMI_SRC": "",
            "PAGEVIEW_SALT": "$PAGEVIEW_SALT",
            "TURNSTILE_SECRET_KEY": "",
            "GITHUB_TOKEN": ""
          }
          EOF

      # 必须显式带 --name：wrangler.jsonc 由生产模板生成，不带 --name 时
      # secret bulk 会把密钥写到生产 Worker。曾经漏了这个参数，预览 Worker
      # 零密钥 → serverEnv() 校验失败 → 整站 500 Internal Server Error。
      - name: Upload preview secrets
        run: |
          bunx wrangler secret bulk secrets.json --name "${PREVIEW_WORKER_NAME}-preview"

      # 回归防线：wrangler 对「密钥写错 Worker」完全不报错，部署照样 success，
      # 只有线上请求才会 500。这里直接断言目标 Worker 的密钥齐全。
      - name: Verify preview worker secrets
        run: |
          bunx wrangler secret list --name "${PREVIEW_WORKER_NAME}-preview" --format json > /tmp/preview-secrets.json
          node -e "
            const fs = require('fs');
            const names = JSON.parse(fs.readFileSync('/tmp/preview-secrets.json', 'utf8')).map((s) => s.name);
            const required = ['BETTER_AUTH_SECRET', 'BETTER_AUTH_URL', 'ADMIN_EMAIL', 'GITHUB_CLIENT_ID', 'GITHUB_CLIENT_SECRET', 'CLOUDFLARE_ZONE_ID', 'DOMAIN', 'PAGEVIEW_SALT'];
            const missing = required.filter((n) => !names.includes(n));
            if (missing.length) {
              console.error('FATAL: 预览 Worker 缺少密钥: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('预览 Worker 密钥就绪: ' + names.length + ' 个');
          "

      - name: Deploy to Cloudflare Workers (preview)
        run: |
          bun run build
          bunx wrangler deploy --name "${PREVIEW_WORKER_NAME}-preview"

      - name: Output preview URL
        run: |
          echo "### Preview 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: https://${PREVIEW_HOST}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**分支**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**提交**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

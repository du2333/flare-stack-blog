version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Los_Angeles"

  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Los_Angeles"
    ignore:
      # Types follow the Node major pinned in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @cloudflare/vitest-plugin only supports vitest 4.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      tiptap:
        patterns:
          - "@tiptap/*"
      react:
        patterns:
          - "react"
          - "react-dom"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      ui:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/vite"
          - "tw-animate-css"
          - "tailwind-merge"
          - "class-variance-authority"
          - "lucide-react"
      # These ship in lockstep; bumping one package alone breaks the build.
      orpc:
        patterns:
          - "@orpc/*"
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      cloudflare:
        patterns:
          - "cf"
          - "@cloudflare/*"
      tooling:
        patterns:
          - "vite"
          - "vite-tsconfig-paths"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "@biomejs/biome"
          - "@testing-library/*"
          - "jsdom"
          - "web-vitals"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
